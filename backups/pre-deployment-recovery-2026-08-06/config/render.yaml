services:
  - type: web
    name: all-vaps
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      # --- Core (obligatoire) ---
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: PAYMENT_TEST_MODE
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
      # --- SumUp ---
      - key: SUMUP_API_KEY
        sync: false
      - key: SUMUP_MERCHANT_CODE
        sync: false
      - key: SUMUP_WEBHOOK_SECRET
        sync: false
      # --- Viva.com ---
      - key: VIVA_CLIENT_ID
        sync: false
      - key: VIVA_CLIENT_SECRET
        sync: false
      - key: VIVA_MERCHANT_ID
        sync: false
      - key: VIVA_API_URL
        sync: false
      - key: VIVA_SOURCE_CODE
        sync: false
      - key: VIVA_WEBHOOK_KEY
        sync: false
      - key: VIVA_WEBHOOK_VERIFICATION_KEY
        sync: false
      # --- Email ---
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TRANSPORT
        value: auto
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false

databases:
  - name: allvaps-db
    plan: free
    databaseName: allvaps
    user: allvaps
