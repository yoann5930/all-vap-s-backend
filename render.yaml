services:
  - type: web
    name: all-vaps
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      # --- Core (obligatoire) ---
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: PAYMENT_TEST_MODE
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
      # --- SumUp ---
      - key: SUMUP_API_KEY
        sync: false
      - key: SUMUP_MERCHANT_CODE
        sync: false
      - key: SUMUP_WEBHOOK_SECRET
        sync: false
      - key: SUMUP_API_BASE_URL
        value: https://api.sumup.com
      - key: SUMUP_SYNC_ENABLED
        value: "false"
      - key: SUMUP_SYNC_INTERVAL_SECONDS
        value: "1800"
      - key: SUMUP_SYNC_OVERLAP_MINUTES
        value: "10"
      - key: CRON_SECRET
        sync: false
      - key: CATALOGUE_MAGASIN_PATH
        value: ./catalogues/catalogue-magasin-all-vaps.csv
      - key: CATALOGUE_AVA_PATH
        value: ./catalogues/catalogue-ava-all-vaps.csv
      # --- Viva.com ---
      - key: VIVA_CLIENT_ID
        sync: false
      - key: VIVA_CLIENT_SECRET
        sync: false
      - key: VIVA_MERCHANT_ID
        sync: false
      - key: VIVA_API_URL
        sync: false
      - key: VIVA_SOURCE_CODE
        sync: false
      - key: VIVA_WEBHOOK_KEY
        sync: false
      - key: VIVA_WEBHOOK_VERIFICATION_KEY
        sync: false
      # --- Email ---
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TRANSPORT
        value: auto
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false

databases:
  - name: allvaps-db
    plan: free
    databaseName: allvaps
    user: allvaps

cron:
  - name: sumup-stock-sync
    schedule: "*/30 * * * *"
    command: curl -sf -H "Authorization: Bearer $CRON_SECRET" "$NEXT_PUBLIC_APP_URL/api/cron/sumup-sync"
