# PostgreSQL local dédié All Vap's (port 5433 pour éviter le conflit avec d'autres Postgres sur 5432)
services:
  postgres:
    image: postgres:16-alpine
    container_name: allvaps-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: allvaps
      POSTGRES_PASSWORD: allvaps
      POSTGRES_DB: allvaps
    volumes:
      - allvaps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allvaps -d allvaps"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optionnel : worker SumUp (profile sync)
  # docker compose --profile sync up -d sumup-worker
  sumup-worker:
    profiles: ["sync"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      SUMUP_SYNC_ENABLED: "true"
      SUMUP_SYNC_INTERVAL_SECONDS: "1800"
    command: sh -c "npm run sumup:worker"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  allvaps_pgdata:
